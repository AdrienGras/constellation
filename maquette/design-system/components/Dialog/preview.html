<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Dialog — aperçu</title></head>
<body>
<div id="root" class="cs-demo-col"></div>
<script>
var C = window.Constellation, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h('div', { style: { height: '430px', width: '100%' } }, h(C.Dialog, { open: true, inline: true, title: 'Ajouter un item à 2027', description: 'Un projet à réaliser ou une notion à apprendre.',
    footer: [h(C.Button, { key: 'a', variant: 'ghost' }, 'Annuler'), h(C.Button, { key: 'b' }, 'Ajouter')] },
    h(C.Input, { label: 'Titre', defaultValue: 'API REST avec Symfony' }),
    h(C.Input, { label: 'Ressource (URL)', defaultValue: 'https://symfony.com/doc/current/index.html' })))
));
</script>
</body>
</html>
