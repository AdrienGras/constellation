<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Button — aperçu</title></head>
<body>
<div id="root" class="cs-demo"></div>
<script>
var C = window.Constellation, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(C.Button, { icone: 'plus' }, 'Ajouter un item'),
  h(C.Button, { variant: 'secondary' }, 'Refaire le quiz'),
  h(C.Button, { variant: 'outline', icone: 'disque' }, 'Exporter en JSON'),
  h(C.Button, { variant: 'ghost' }, 'Annuler'),
  h(C.Button, { variant: 'link', as: 'a', href: '#fiche' }, 'Voir la fiche'),
  h(C.Button, { size: 'sm', variant: 'outline' }, 'Petit'),
  h(C.Button, { size: 'lg' }, 'Commencer le quiz'),
  h(C.Button, { disabled: true }, 'Indisponible')
));
</script>
</body>
</html>
